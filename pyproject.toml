[project]
name = "kronos"
version = "0.1.0"
description = "Jarvis: a multi-agent personal assistant built on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.14.0",
    "httpx>=0.27",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
kronos = "kronos.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
